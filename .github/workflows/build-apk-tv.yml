# MuseTV cloud build — leanback / TV
# Signing (works in any fork):
#   - Secret KEYSTORE_BASE64 set -> formal key from secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS.
#   - Not set -> a throwaway key is generated on the fly, so a fresh fork builds with no setup.
#   - Optional secret KEY_CERT_SHA256 (cert SHA-256, lowercase hex): build fails if the signed APK's cert differs.
# After Gradle the APK is zipaligned and re-signed v1/v2/v3 with apksigner (v1 is mandatory).
# Owner's master key files: private repo Journey4U/muse branch "signing" (storage only, never built).

name: Build MuseTV (leanback release)

on:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare keystore (formal from secrets, else throwaway)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > muse-release.keystore
            echo "SIGN_MODE=formal" >> "$GITHUB_ENV"
            A="${KS_ALIAS:-muse}"; P="$KS_PASS"
            echo "== formal keystore from secrets =="
          else
            keytool -genkeypair -keystore muse-release.keystore -alias muse -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=MuseTV, OU=MuseTV, O=MuseTV, L=Shanghai, ST=Shanghai, C=CN"
            echo "SIGN_MODE=throwaway" >> "$GITHUB_ENV"
            A=muse; P=android
            echo "::warning::No KEYSTORE_BASE64 secret - signing with a throwaway key (APK cannot update one signed with another key)"
          fi
          ls -la muse-release.keystore
          {
          echo "sdk.dir=$ANDROID_HOME"
          echo "storeFile=$GITHUB_WORKSPACE/muse-release.keystore"
          echo "keyAlias=$A"
          echo "storePassword=$P"
          } > local.properties
          sed 's/storePassword=.*/storePassword=***/' local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build leanback release APK
        run: |
          ./gradlew :app:assembleLeanbackRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx5g" || \
            (echo "== first attempt failed, retrying once ==" && \
             ./gradlew :app:assembleLeanbackRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx5g")

      - name: Re-sign v1/v2/v3 and verify
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          CERT_SHA256: ${{ secrets.KEY_CERT_SHA256 }}
        run: |
          if [ "$SIGN_MODE" = "formal" ]; then export KSP="$KS_PASS"; KA="${KS_ALIAS:-muse}"; else export KSP=android; KA=muse; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in app/build/outputs/apk/leanback/release/*.apk; do
            "$BT/zipalign" -p -f 4 "$f" "$f.aligned"
            "$BT/apksigner" sign --ks muse-release.keystore --ks-key-alias "$KA" \
              --ks-pass env:KSP --key-pass env:KSP \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
              --out "$f.signed" "$f.aligned"
            "$BT/apksigner" verify --verbose --min-sdk-version 21 --print-certs "$f.signed" | tee verify.txt
            grep -q "Verified using v1 scheme (JAR signing): true" verify.txt || { echo "v1 missing: $f"; exit 1; }
            if [ -n "$CERT_SHA256" ]; then
              grep -qi "SHA-256 digest: $CERT_SHA256" verify.txt || { echo "CERT MISMATCH: $f"; exit 1; }
              echo "cert fingerprint OK"
            else
              echo "::notice::KEY_CERT_SHA256 not set - fingerprint check skipped ($SIGN_MODE key)"
            fi
            mv "$f.signed" "$f"; rm -f "$f.aligned" verify.txt
          done
          rm -f muse-release.keystore

      - name: Upload signed APK (release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="leanback-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" app/build/outputs/apk/leanback/release/*.apk --title "$TAG" --notes "CI leanback build" --prerelease
