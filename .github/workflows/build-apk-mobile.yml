# MuseTV cloud build — GitHub Actions workflow
# Place this file at: <repo>/.github/workflows/build-apk.yml
# Builds :app:assembleLeanbackRelease on a free GitHub runner (~7 GB RAM,
# which fixes the local Gradle-daemon memory crash) and uploads the signed APK.
#
# Source facts this was written from (FongMi-TV, checked 2026-10-19):
# - Gradle wrapper 9.7.1, AGP 9.3.1, JDK 17, compileSdk/targetSdk 37, minSdk 24
# - flavors: leanback + mobile (dimension "device"); TV shell = leanback
# - release signing reads local.properties: storeFile / keyAlias / storePassword
# - modules: app, catvod, chaquo, quickjs (thunder/PCDN already removed)

name: Build MuseTV (mobile release)

on:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate throwaway keystore (CI signing only; APK is re-signed locally)
        run: |
          keytool -genkeypair -keystore muse-release.keystore -alias muse -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MuseTV, OU=MuseTV, O=MuseTV, L=Shanghai, ST=Shanghai, C=CN"
          ls -la muse-release.keystore

      - name: Write local.properties (SDK + signing)
        run: |
          {
          echo "sdk.dir=$ANDROID_HOME"
          echo "storeFile=$GITHUB_WORKSPACE/muse-release.keystore"
          echo "keyAlias=muse"
          echo "storePassword=android"
          } > local.properties
          cat local.properties | sed 's/storePassword=.*/storePassword=***/'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mobile release APK
        run: |
          ./gradlew :app:assembleMobileRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx5g" || \
            (echo "== first attempt failed, retrying once ==" && \
             ./gradlew :app:assembleMobileRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx5g")

      - name: Upload signed APK (release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mobile-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" app/build/outputs/apk/mobile/release/*.apk --title "$TAG" --notes "CI mobile build" --prerelease
